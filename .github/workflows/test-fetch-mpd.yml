name: Test Fetch TVB MPD URL

on:
  schedule:
    # 每 6 小时跑一次 (UTC 时间)
    - cron: '0 */6 * * *'
  workflow_dispatch: {} # 支持在 GitHub 页面手动触发

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要写权限来提交文件到仓库

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch MPD redirect and save to file
        run: |
          set -euo pipefail
          SOURCE_URL="https://php.946985.filegear-sg.me/mytv265.php?id=J"
          
          echo "Fetching URL: $SOURCE_URL"
          
          # 使用 -I 只取响应头，-sS 显示错误，-L 不自动跟随跳转以便抓取原始 302 头
          # 加上真实浏览器 UA 降低被 CF 质询的概率
          RESPONSE=$(curl -sSI \
            -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: zh-CN,zh;q=0.9,en;q=0.8" \
            "$SOURCE_URL")
            
          echo "=== Upstream Response Headers ==="
          echo "$RESPONSE"
          
          # 提取 Location 头
          LOCATION=$(echo "$RESPONSE" | grep -i '^location:' | sed 's/[Ll]ocation: *//; s/\r$//' | head -n1)
          
          if [ -z "$LOCATION" ]; then
            echo "ERROR: No Location header found. Upstream may have blocked the request."
            echo "Dumping first 500 bytes of body for debugging:"
            curl -sS -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15" "$SOURCE_URL" | head -c 500
            exit 1
          fi
          
          echo "Success! Got MPD URL: $LOCATION"
          
          # 创建目录并保存结果
          mkdir -p mpd_result
          echo "$LOCATION" > mpd_result/J.txt
          
          # 记录抓取时间
          echo "Fetched at: $(date -u)" >> mpd_result/J.txt
          
      - name: Commit changes to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mpd_result/
          git commit -m "Update MPD URL for channel J" || echo "No changes to commit"
          git push
