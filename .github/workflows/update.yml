name: update-gpt-m3u
on:
  schedule:
    - cron: "0 */3 * * *"   # 每3小时一次
  workflow_dispatch: {}      # 可在 Actions 页手动运行
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库（不使用第三方 action）
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPO}.git" repo

      - name: 抓公告页里的最新订阅链接
        working-directory: repo
        run: |
          curl -sSL -m 30 -A "Mozilla/5.0 (iPad; CPU OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Safari/604.1" \
            https://mpd.cc.cd -o page.html || { echo "公告页访问失败"; exit 1; }
          wc -c page.html
          LINK=$(grep -oE 'https?://[^"'"'"' <>\\]+playlist\.m3u[^"'"'"' <>\\]*' page.html | head -n1)
          [ -n "$LINK" ] || { echo "页面里没找到 playlist.m3u 链接"; exit 1; }
          echo "::add-mask::$LINK"
          echo "$LINK" > /tmp/link.txt

      - name: 下载直播源并过滤
        working-directory: repo
        run: |
          curl -fsSL -m 120 -A "Mozilla/5.0" "$(cat /tmp/link.txt)" -o src.m3u || { echo "直播源下载失败"; exit 1; }
          wc -c src.m3u
          tr -d '\r' < src.m3u | awk -f filter.awk > gpt.new
          COUNT=$(grep -c '^#EXTINF' gpt.new || true)
          echo "匹配频道数: $COUNT"
          [ "$COUNT" -gt 0 ] || { echo "没有匹配到频道，不更新"; exit 1; }
          mv gpt.new gpt.m3u
          rm -f src.m3u

      - name: 有变化才提交
        working-directory: repo
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add gpt.m3u
          git diff --cached --quiet || (git commit -m "update gpt.m3u" && git push)
